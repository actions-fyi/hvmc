name: PR Metadata
# Lint Metadata is the org ruleset workflow that checks the title. Its runs on pull requests start
# this listener, which runs with the secrets and a write token, for fork pull requests too.
# "Check Metadata" is the old name. It stays until the org ruleset workflow of
# actions-fyi/ruleset-workflows is renamed; after that it can be removed.
on:
  workflow_run:
    workflows: ["Lint Metadata"]
    types: [completed]

permissions: {}

jobs:
  metadata:
    name: Metadata
    # Not in a fork: Claude and Prompt Guard need the org's secrets, which a fork doesn't get.
    if: github.repository_owner == 'actions-fyi'
    cache-mode: none
    permissions:
      actions: write # Re-run the failed Lint Metadata jobs
      contents: read # Check out the default branch for the screen jobs
      id-token: write # Log in to OpenBao for Prompt Guard
      issues: write # Read the repository's labels, label the pull request, and escalate a flag
      pull-requests: write # Read the pull request; apply the title, labels and description
    uses: actions-fyi/shared-workflows/.github/workflows/_pr-metadata.yml@v4.3.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROMPT_GUARD_CLIENT_ID: ${{ secrets.PROMPT_GUARD_CLIENT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
