apiVersion: apps/v1
kind: Deployment
metadata:
  name: hvmc-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hvmc.coordinator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "hvmc.coordinator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hvmc.coordinator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: hvmc-coordinator
      # The ServiceAccount disables automounting; the coordinator is the one
      # pod that needs its token (API server access).
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: {{ include "hvmc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --leader-elect=true
            - --http-bind-address=:{{ include "hvmc.port.http" . }}
            - --metrics-bind-address=:{{ include "hvmc.port.metrics" . }}
            - --health-probe-bind-address=:{{ include "hvmc.port.health" . }}
            {{- if not .Values.hostConfig.existing }}
            - --hostconfig-configmap=hvmc-hostconfig
            {{- end }}
            {{- with .Values.pki.existingCASecret }}
            - --existing-ca-secret={{ . }}
            {{- end }}
          env:
            # The leader labels its own pod (DESIGN §6).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ include "hvmc.port.http" . }}
              protocol: TCP
            - name: metrics
              containerPort: {{ include "hvmc.port.metrics" . }}
              protocol: TCP
            - name: health
              containerPort: {{ include "hvmc.port.health" . }}
              protocol: TCP
          # Readiness is "process up and serving" on every replica, never
          # agent health or leadership (DESIGN §4.8, §6).
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      # The image is linux/amd64 only; clusters with Windows nodes are the
      # normal case for hvmc.
      nodeSelector:
        {{- toYaml (merge (dict) .Values.nodeSelector (dict "kubernetes.io/os" "linux" "kubernetes.io/arch" "amd64")) | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "hvmc.coordinator.selectorLabels" . | nindent 20 }}
        {{- end }}
