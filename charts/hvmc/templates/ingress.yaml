{{- $ing := .Values.facade.ingress -}}
{{- if $ing.enabled -}}
# Agent enrollment (DESIGN §4.6, §8). The lease API paths are added with the
# facade.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hvmc-facade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hvmc.coordinator.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /v1/enroll
            pathType: Exact
            backend:
              service:
                name: hvmc-facade
                port:
                  name: http
      {{- with $ing.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
