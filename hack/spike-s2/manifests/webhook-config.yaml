# DESIGN §7.1: pod CREATE only, and a CEL matchCondition so that only pods
# with a hvmc.fax.fyi/ram limit in a container or init container ever reach
# the webhook. ${CA_BUNDLE} is substituted by run.sh.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: spike-hvmc-pods
webhooks:
  - name: pods.spike.hvmc.fax.fyi
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: Never
    timeoutSeconds: 5
    clientConfig:
      service:
        name: stub-webhook
        namespace: hvmc-spike
        path: /mutate
        port: 443
      caBundle: ${CA_BUNDLE}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
    matchConditions:
      - name: requests-hvmc-ram
        expression: >-
          object.spec.containers.exists(c, has(c.resources) && has(c.resources.limits)
          && 'hvmc.fax.fyi/ram' in c.resources.limits)
          || (has(object.spec.initContainers) && object.spec.initContainers.exists(c,
          has(c.resources) && has(c.resources.limits) && 'hvmc.fax.fyi/ram' in c.resources.limits))
