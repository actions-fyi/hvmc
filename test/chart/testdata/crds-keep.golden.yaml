# Source: hvmc/templates/networkpolicy.yaml
# Coordinator egress (DESIGN §11): API server, DNS, agents' gRPC port. Agents
# run outside the cluster at addresses only HostConfig knows, so the agent
# rule allows any destination on those ports; mTLS protects them (§4.5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hvmc-coordinator-egress
  namespace: hvmc
  labels:
    helm.sh/chart: hvmc-0.0.0-dev
    app.kubernetes.io/name: hvmc
    app.kubernetes.io/instance: hvmc
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hvmc
    app.kubernetes.io/component: coordinator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hvmc
      app.kubernetes.io/instance: hvmc
      app.kubernetes.io/component: coordinator
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 9443
---
