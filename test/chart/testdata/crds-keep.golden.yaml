rules:
  # Agent service entries (DESIGN §4.7), hvmc-ca, bootstrap tokens,
  # hvmc-ca-bundle and the chart-rendered hvmc-hostconfig (DESIGN §4.6, §5).
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  # The leader labels its own pod hvmc.fax.fyi/leader=true (DESIGN §6).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  # Leader election (DESIGN §6).
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
