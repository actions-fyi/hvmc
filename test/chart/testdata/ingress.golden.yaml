# Source: hvmc/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hvmc-coordinator
  namespace: hvmc
  labels:
    helm.sh/chart: hvmc-0.0.0-dev
    app.kubernetes.io/name: hvmc
    app.kubernetes.io/instance: hvmc
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hvmc
    app.kubernetes.io/component: coordinator
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hvmc
      app.kubernetes.io/instance: hvmc
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        helm.sh/chart: hvmc-0.0.0-dev
        app.kubernetes.io/name: hvmc
        app.kubernetes.io/instance: hvmc
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: hvmc
        app.kubernetes.io/component: coordinator
    spec:
      serviceAccountName: hvmc-coordinator
      # The ServiceAccount disables automounting; the coordinator is the one
      # pod that needs its token (API server access).
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: docker.io/matfax/hvmc:0.0.0-dev
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --leader-elect=true
            - --http-bind-address=:8080
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --hostconfig-configmap=hvmc-hostconfig
          env:
            # The leader labels its own pod (DESIGN §6).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          # Readiness is "process up and serving" on every replica, never
          # agent health or leadership (DESIGN §4.8, §6).
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 256Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      # The image is linux/amd64 only; clusters with Windows nodes are the
      # normal case for hvmc.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hvmc
                    app.kubernetes.io/instance: hvmc
                    app.kubernetes.io/component: coordinator
