data:
  hostconfig.yaml: |
    apiVersion: hvmc.fax.fyi/v1alpha1
    kind: HostConfig
    metadata:
      name: default
      labels:
        app.kubernetes.io/name: hvmc
        app.kubernetes.io/part-of: hvmc
    spec:
      agents:
      - dnsName: hyperv-01.example.com
        name: host
      capacity: 0
      defaultMargin: 2Gi
      dmAccounting: maximum
      reserve: 4Gi
      staleAfter: 30s
      step: 256Mi
      vms:
      - base: 3Gi
        guestOS: linux
        margin: 2Gi
        mode: fixed
        name: linux-node-1
        node: linux-node-1
      - base: 4Gi
        guestOS: windows
        mode: static
        name: windows-node-1
        node: windows-node-1
        policy:
          max: 24Gi
          min: 6Gi
      - base: 3Gi
        guestAgent:
          dnsName: docker-host-1.example.com
          port: 9444
        guestOS: windows
        mode: static
        name: docker-host-1
      - base: 2Gi
        guestAgent:
          dnsName: probe-1.example.com
        guestOS: windows
        mode: static
        name: probe-1
        probe: true
