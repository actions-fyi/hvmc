kind: NetworkPolicy
metadata:
  name: hvmc-coordinator-egress
  namespace: hvmc
  labels:
    helm.sh/chart: hvmc-0.0.0-dev
    app.kubernetes.io/name: hvmc
    app.kubernetes.io/instance: hvmc
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hvmc
    app.kubernetes.io/component: coordinator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hvmc
      app.kubernetes.io/instance: hvmc
      app.kubernetes.io/component: coordinator
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 9444
