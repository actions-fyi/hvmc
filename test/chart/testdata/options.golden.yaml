# Source: hvmc/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hvmc-coordinator
  namespace: hvmc
  labels:
    helm.sh/chart: hvmc-0.0.0-dev
