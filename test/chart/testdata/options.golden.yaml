# Source: hvmc/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hvmc-coordinator
  labels:
    helm.sh/chart: hvmc-0.0.0-dev
    app.kubernetes.io/name: hvmc
    app.kubernetes.io/instance: hvmc
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hvmc
    app.kubernetes.io/component: coordinator
rules:
  # Node InternalIP is the address of node-mapped guest agents (DESIGN §4.7).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # Events about cluster-scoped objects (HostConfig, Nodes) are recorded in the
  # "default" namespace; patch lets the recorder aggregate repeated events.
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # Finalizers: owner references with blockOwnerDeletion to HostConfig
  # (DESIGN §11 cleanup).
  - apiGroups: [hvmc.fax.fyi]
    resources:
      - hostconfigs
      - hostconfigs/status
      - hostconfigs/finalizers
      - memoryleases
      - memoryleases/status
      - memoryleases/finalizers
    verbs: [get, list, watch, create, update, patch, delete]
